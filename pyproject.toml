[project]
name = "kovzanka"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.163.2",
    "jinja2>=3.1.6",
    "pydantic==2.14.3",
    "pymysql[rsa]>=1.1",
    "python-dotenv==1.2.4",
    "python-telegram-bot>=22.8",
    "requests>=2.34.2",
    "slowapi>=0.1.10",
    "sqlalchemy==2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
    "ignore::pytest.PytestRemovedIn10Warning",
    "ignore::pytest.PytestConfigWarning",
    "ignore::DeprecationWarning:starlette.*",
]
