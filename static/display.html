<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Табло черги - Ковзанка</title>
    <script defer src="/static/js/alpine.js"></script>
    <script src="/static/js/tailwind.js"></script>
    <script src="/static/js/shared.js"></script>
<link rel="stylesheet" href="/static/css/akulamama.css">
<script defer src="/static/js/akulamama.js"></script>
</head>
<body class="ak-site ak-display bg-gray-900 text-white min-h-screen p-6 font-sans" x-data="displayApp()">
<header class="ak-header">
    <a href="/" class="ak-logo" aria-label="Акула Мама — головна"><img src="/static/brand/logo.png" alt="Акула Мама"><span>Ковзанка</span></a>
    <nav class="ak-nav" aria-label="Головна навігація"><a href="/">Головна</a><a href="/inventory">Залишки</a><a href="/display">Табло</a><a href="/status">Мій талон</a><a href="/staff">Для персоналу</a></nav>
</header>
<main class="ak-page">
<div class="max-w-7xl mx-auto">
    <header class="flex flex-row justify-between items-center pb-2 sm:pb-3 border-b border-gray-800 mb-4 sm:mb-6">
        <h1 class="text-lg sm:text-xl md:text-2xl font-black uppercase tracking-wider text-blue-400 text-center flex-1">Електронна Черга</h1>

        <!-- WebSocket Status Badge with Mouseover Tooltip -->
        <div :title="wsStatus.title" class="inline-flex items-center justify-center py-1 cursor-help shrink-0 ml-2">
            <span :class="wsStatus.class" class="w-2.5 h-2.5 sm:w-3 sm:h-3 rounded-full transition-colors inline-block"></span>
            <span class="text-xs font-mono text-gray-400 leading-none" :class="wsStatus.text ? 'ml-2' : ''" x-text="wsStatus.text"></span>
        </div>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
        <!-- INVITATIONS  -->
        <div class="bg-gray-800/80 rounded-2xl p-3 sm:p-5 border border-green-500/30 shadow-2xl">
            <h2 class="text-lg sm:text-xl font-bold text-green-400 mb-3 flex items-center uppercase tracking-wide">
                <span class="inline-block w-3 h-3 bg-green-500 rounded-full mr-2.5 animate-ping"></span>Запрошуються
            </h2>
            <div class="grid grid-cols-2 gap-2.5 sm:gap-3">
                <template :key="item.id" x-for="item in callingItems">
                    <div class="bg-green-950/80 border-2 border-green-500 rounded-xl p-2.5 sm:p-3 text-center transition min-w-0">
                        <span class="text-2xl sm:text-4xl font-black text-green-400 font-mono block leading-tight"
                              x-text="'#' + item.ticket_number"></span>
                        <div class="text-xs sm:text-sm text-gray-300 font-mono mt-0.5" x-text="'Час: ' + item.duration_minutes + ' хв'"></div>
                        <div class="text-[10px] sm:text-xs text-gray-300 font-mono break-words mt-0.5"
                             x-text="'Розмір(и): ' + formatSizesSummary(item.shoe_sizes)"></div>
                    </div>
                </template>
            </div>

            <template x-if="callingItems.length === 0">
                <div class="text-center py-6 text-gray-500 font-medium text-sm sm:text-base">Немає активних викликів</div>
            </template>
        </div>

        <!-- QUEUED  -->
        <div class="bg-gray-800/80 rounded-2xl p-3 sm:p-5 border border-gray-700 shadow-2xl">
            <h2 class="text-lg sm:text-xl font-bold text-yellow-400 mb-3 uppercase tracking-wide">Готуються (Очікують)</h2>
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 sm:gap-2.5">
                <template :key="item.id" x-for="item in waitingItems">
                    <div class="bg-gray-900 border border-gray-700 rounded-lg p-2 sm:p-2.5 text-center min-w-0">
                        <span class="text-xl sm:text-2xl font-bold text-yellow-300 font-mono block leading-tight"
                              x-text="'#' + item.ticket_number"></span>
                        <div class="text-xs sm:text-sm text-gray-300 font-mono mt-0.5" x-text="'Час: ' + item.duration_minutes + ' хв'"></div>
                        <div class="text-[9px] sm:text-xs text-gray-300 font-mono break-words mt-0.5"
                             x-text="'Розмір(и): ' + (typeof formatSizesSummary === 'function'
                             ? formatSizesSummary(item.shoe_sizes) : (Array.isArray(item.shoe_sizes)
                             ? item.shoe_sizes.join(', ') : (item.shoe_sizes || '—')))">
                        </div>
                    </div>
                </template>
            </div>

            <template x-if="waitingItems.length === 0">
                <div class="text-center py-6 text-gray-500 font-medium text-sm sm:text-base">Черга порожня</div>
            </template>
        </div>
    </div>

    <!-- ON ICE (SERVED) -->
    <div class="mt-4 sm:mt-6 bg-gray-800/80 rounded-2xl p-3 sm:p-5 border border-blue-500/30 shadow-2xl w-full">
        <h2 class="text-lg sm:text-xl font-bold text-blue-400 mb-3 uppercase tracking-wide flex items-center">
            <span class="inline-block w-3 h-3 bg-blue-500 rounded-full mr-2.5"></span>На льоду (Обслуговуються)
        </h2>
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-2.5 sm:gap-3">
            <template :key="item.id" x-for="item in servedItems">
                <div class="bg-blue-950/80 border border-blue-500/50 rounded-xl p-2.5 sm:p-3 text-center transition min-w-0">
                    <span class="text-xl sm:text-2xl font-black text-blue-300 font-mono block leading-tight" x-text="'#' + item.ticket_number"></span>
                    <div class="text-xs text-gray-300 font-mono mt-0.5" x-text="'Сеанс: ' + item.duration_minutes + ' хв'"></div>
                    <div class="text-[9px] sm:text-xs text-gray-300 font-mono break-words mt-0.5" x-text="'Розмір(и): ' + formatSizesSummary(item.shoe_sizes)"></div>
                </div>
            </template>
        </div>

        <template x-if="servedItems.length === 0">
            <div class="text-center py-6 text-gray-500 font-medium text-sm sm:text-base">Наразі нікого немає на льоду</div>
        </template>
    </div>
</div>

<script>
    function displayApp() {
        return {
            ...queueMixin(),
            ...wsSyncMixin(),

            get callingItems() { return this.queue.filter(item => item.status === "ВИКЛИКАЄТЬСЯ") },
            get waitingItems() { return this.queue.filter(item => item.status === "ЧЕКАЄ").slice(0, 12) },
            get servedItems() { return this.queue.filter(item => item.status === "ОБСЛУГОВУЄТЬСЯ") },

            get wsStatus() { return getWsStatus(this.wsConnected) },

            init() {
                this.fetchQueue()
                setInterval(() => {this.fetchQueue()}, 3000)
                this.initWebSocket()
            }
        }
    }
</script>
</main>
<footer class="ak-footer"><span>© Акула Мама · Ковзанка</span><span>Час для руху. Місце для вражень.</span><a href="/staff">Вхід для працівників ↗</a></footer>
</body>
</html>
