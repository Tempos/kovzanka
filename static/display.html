<!DOCTYPE html>
<html lang="uk" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Табло черги - Ковзанка</title>
    <script defer src="/static/js/alpine.js"></script>
    <script src="/static/js/tailwind.js"></script>
    <script src="/static/js/shared.js"></script>
    <link rel="stylesheet" href="/static/css/akulamama.css">
    <script defer src="/static/js/akulamama.js"></script>
</head>
<body class="ak-site ak-display min-h-screen p-6 font-sans" x-data="displayApp()">
<header class="ak-header">
    <a href="/" class="ak-logo" aria-label="Акула Мама — головна"><img src="/static/brand/logo.png" alt="Акула Мама"><span>Ковзанка</span></a>
    <nav class="ak-nav" aria-label="Головна навігація"><a href="/">Головна</a><a href="/inventory">Залишки</a><a href="/display">Табло</a><a href="/status">Мій талон</a></nav>
</header>
<main class="ak-page">
<div class="w-full h-full flex flex-col flex-1">
    <header class="flex flex-row justify-between items-center pb-2 border-b border-gray-800 mb-2 shrink-0">
        <h1 class="text-xl sm:text-2xl md:text-3xl font-black uppercase tracking-wider text-blue-400 text-center flex-1">Електронна Черга</h1>

        <div class="flex items-center space-x-3">
            <!-- Fullscreen Toggle Button (тільки іконка) -->
            <button @click="toggleFullScreen()" class="bg-gray-800 hover:bg-gray-700 text-gray-300 hover:text-white p-2 rounded-lg border border-gray-700 text-sm font-mono transition flex items-center justify-center" :title="isFullscreen ? 'Вийти з повного екрана' : 'На весь екран'">
                <span class="text-base leading-none" x-text="isFullscreen ? '🗗' : '🗖'"></span>
            </button>

            <!-- WebSocket Status Badge with Mouseover Tooltip -->
            <div :title="wsStatus.title" class="inline-flex items-center justify-center py-1 cursor-help shrink-0">
                <span :class="wsStatus.class" class="w-2.5 h-2.5 sm:w-3 sm:h-3 rounded-full transition-colors inline-block"></span>
                <span class="text-xs font-mono text-gray-400 leading-none" :class="wsStatus.text ? 'ml-2' : ''" x-text="wsStatus.text"></span>
            </div>
        </div>
    </header>

    <div class="fullscreen-grid-container grid grid-cols-1 md:grid-cols-2 gap-3 flex-1 min-h-0">
        <!-- INVITATIONS  -->
        <div class="bg-gray-800/80 rounded-2xl p-3 border border-green-500/30 shadow-2xl flex flex-col min-h-0">
            <h2 class="text-base sm:text-lg font-bold text-green-400 mb-2 flex items-center uppercase tracking-wide shrink-0">
                <span class="inline-block w-2.5 h-2.5 bg-green-500 rounded-full mr-2 animate-ping"></span>Запрошуються
            </h2>
            <div class="grid grid-cols-2 gap-2 content-start flex-1 overflow-y-auto">
                <template :key="item.id" x-for="item in callingItems">
                    <div class="bg-green-950/80 border-2 border-green-500 rounded-xl p-2 text-center transition min-w-0">
                        <span class="text-xl sm:text-3xl font-black text-green-400 font-mono block leading-tight" x-text="'#' + item.ticket_number"></span>
                        <div class="text-[11px] text-gray-300 font-mono mt-0.5" x-text="'Час: ' + item.duration_minutes + ' хв'"></div>
                        <div class="text-[9px] text-gray-300 font-mono break-words mt-0.5" x-text="'Розмір(и): ' + formatSizesSummary(item.shoe_sizes)"></div>
                    </div>
                </template>
            </div>

            <template x-if="callingItems.length === 0">
                <div class="text-center py-4 text-gray-500 font-medium text-sm m-auto">Немає активних викликів</div>
            </template>
        </div>

        <!-- QUEUED  -->
        <div class="bg-gray-800/80 rounded-2xl p-3 border border-gray-700 shadow-2xl flex flex-col min-h-0">
            <h2 class="text-base sm:text-lg font-bold text-yellow-400 mb-2 uppercase tracking-wide shrink-0">Готуються (Очікують)</h2>
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 content-start flex-1 overflow-y-auto">
                <template :key="item.id" x-for="item in waitingItems">
                    <div class="bg-gray-900 border border-gray-700 rounded-lg p-2 text-center min-w-0">
                        <span class="text-lg sm:text-xl font-bold text-yellow-300 font-mono block leading-tight" x-text="'#' + item.ticket_number"></span>
                        <div class="text-[11px] text-gray-300 font-mono mt-0.5" x-text="'Час: ' + item.duration_minutes + ' хв'"></div>
                        <div class="text-[9px] text-gray-300 font-mono break-words mt-0.5" x-text="'Розмір(и): ' + (typeof formatSizesSummary === 'function'
                             ? formatSizesSummary(item.shoe_sizes) : (Array.isArray(item.shoe_sizes)
                             ? item.shoe_sizes.join(', ') : (item.shoe_sizes || '—')))">
                        </div>
                    </div>
                </template>
            </div>

            <template x-if="waitingItems.length === 0">
                <div class="text-center py-4 text-gray-500 font-medium text-sm m-auto">Черга порожня</div>
            </template>
        </div>

        <!-- ON ICE (SERVED) -->
        <div class="md:col-span-2 bg-gray-800/80 rounded-2xl p-3 border border-blue-500/30 shadow-2xl w-full flex flex-col min-h-0">
            <h2 class="text-base sm:text-lg font-bold text-blue-400 mb-2 uppercase tracking-wide flex items-center shrink-0">
                <span class="inline-block w-2.5 h-2.5 bg-blue-500 rounded-full mr-2"></span>На льоду (Обслуговуються)
            </h2>
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-2 content-start flex-1 overflow-y-auto">
                <template :key="item.id" x-for="item in servedItems">
                    <div class="bg-blue-950/80 border border-blue-500/50 rounded-xl p-2 text-center transition min-w-0">
                        <span class="text-lg sm:text-xl font-black text-blue-300 font-mono block leading-tight" x-text="'#' + item.ticket_number"></span>
                        <div class="text-[11px] text-gray-300 font-mono mt-0.5" x-text="'Сеанс: ' + item.duration_minutes + ' хв'"></div>
                        <div class="text-[9px] text-gray-300 font-mono break-words mt-0.5" x-text="'Розмір(и): ' + formatSizesSummary(item.shoe_sizes)"></div>
                    </div>
                </template>
            </div>

            <template x-if="servedItems.length === 0">
                <div class="text-center py-4 text-gray-500 font-medium text-sm m-auto">Наразі нікого немає на льоду</div>
            </template>
        </div>
    </div>
</div>

<script>
    function displayApp() {
        return {
            ...queueMixin(),
            ...wsSyncMixin(),

            isFullscreen: false,

            get callingItems() { return this.queue.filter(item => item.status === "ВИКЛИКАЄТЬСЯ") },
            get waitingItems() { return this.queue.filter(item => item.status === "ЧЕКАЄ").slice(0, 12) },
            get servedItems() { return this.queue.filter(item => item.status === "ОБСЛУГОВУЄТЬСЯ") },

            get wsStatus() { return getWsStatus(this.wsConnected) },

            toggleFullScreen() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => {
                        console.error("Error attempting to enable full-screen mode:", err)
                    })}
                else {if (document.exitFullscreen) {document.exitFullscreen()}}
            },

            init() {
                this.fetchQueue()
                setInterval(() => {this.fetchQueue()}, 3000)
                this.initWebSocket()

                document.addEventListener('fullscreenchange', () => {
                    this.isFullscreen = !!document.fullscreenElement;
                    if (this.isFullscreen) {document.body.classList.add('fullscreen-mode')}
                    else {document.body.classList.remove('fullscreen-mode')}
                });
            }
        }
    }
</script>
</main>
<footer class="ak-footer"><span>© Акула Мама · Ковзанка</span><span>Час для руху. Місце для вражень.</span><a href="/staff">Вхід для працівників ↗</a></footer>
</body>
</html>
