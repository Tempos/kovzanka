<!-- МОДАЛЬНЕ ВІКНО ТЕХНІЧНОЇ ПЕРЕРВИ / МАСОВОГО ДОДАВАННЯ ЧАСУ -->
<div x-show="techBreakModal.open" x-cloak class="fixed inset-0 bg-black/75 flex items-center justify-center z-50 p-4"
     @keydown.escape.window="if (techBreakModal.open) techBreakModal.open = false" @click.self="techBreakModal.open = false">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl border-t-4 border-amber-500">
        <h3 class="text-xl font-bold text-amber-800 mb-1">⚠️ Технічна перерва</h3>
        <p class="text-xs text-gray-500 mb-4">Ця дія додасть +<span x-text="effectiveTechBreakMinutes"></span> хв до часу всіх активних квитків на льоду. Введіть логін та пароль адміністратора.
        </p>

        <div class="space-y-3 mb-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Логін адміністратора *</label>
                <input type="text" x-model="techBreakModal.username" placeholder="admin" autocomplete="username" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm text-gray-900 focus:ring-2 focus:ring-amber-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Пароль адміністратора *</label>
                <input type="password" x-model="techBreakModal.password" x-ref="adminPasswordInput" @keyup.enter="submitTechBreak()" placeholder="Введіть пароль..." autocomplete="current-password"
                       class="w-full border border-gray-300 rounded-lg p-2.5 text-sm text-gray-900 focus:ring-2 focus:ring-amber-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Час додавання (хв)</label>
                <div class="grid grid-cols-3 gap-2 mb-2">
                    <button type="button" @click="selectTechBreakMinutes(10)" class="py-2 rounded-lg text-sm font-bold border transition"
                            :class="techBreakModal.customMinutes === '' && techBreakModal.minutes === 10 ? 'bg-amber-600 text-white border-amber-600' : 'bg-amber-50 text-amber-900 border-amber-200 hover:bg-amber-100'">
                        +10 хв
                    </button>
                    <button type="button" @click="selectTechBreakMinutes(20)" class="py-2 rounded-lg text-sm font-bold border transition"
                            :class="techBreakModal.customMinutes === '' && techBreakModal.minutes === 20 ? 'bg-amber-600 text-white border-amber-600' : 'bg-amber-50 text-amber-900 border-amber-200 hover:bg-amber-100'">
                        +20 хв
                    </button>
                    <button type="button" @click="selectTechBreakMinutes(30)" class="py-2 rounded-lg text-sm font-bold border transition"
                            :class="techBreakModal.customMinutes === '' && techBreakModal.minutes === 30 ? 'bg-amber-600 text-white border-amber-600' : 'bg-amber-50 text-amber-900 border-amber-200 hover:bg-amber-100'">
                        +30 хв
                    </button>
                </div>
                <input type="number" min="1" max="240" placeholder="Свій час у хвилинах (напр. 15)..."
                       x-model="techBreakModal.customMinutes" @input="onCustomTechBreakInput()" @keyup.enter="submitTechBreak()"
                       class="w-full border border-gray-300 rounded-lg p-2.5 text-sm text-gray-900 focus:ring-2 focus:ring-amber-500 focus:outline-none">
            </div>

            <p x-show="techBreakModal.error" x-text="techBreakModal.error" class="text-red-500 text-xs mt-1 font-medium"></p>
        </div>

        <div class="flex justify-end gap-3">
            <button type="button" @click="techBreakModal.open = false" class="bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded-xl text-sm font-medium text-gray-700">Скасувати</button>
            <button type="button" @click="submitTechBreak()" :disabled="!techBreakModal.username.trim() || !techBreakModal.password || effectiveTechBreakMinutes <= 0"
                    class="bg-amber-600 hover:bg-amber-700 text-white px-5 py-2 rounded-xl text-sm font-bold disabled:opacity-40 disabled:cursor-not-allowed transition">
                Підтвердити (+<span x-text="effectiveTechBreakMinutes"></span> хв)
            </button>
        </div>
    </div>
</div>
