<!-- 1. МОДАЛЬНЕ ВІКНО СПИСКУ КОРИСТУВАЧІВ -->
<div x-show="showUsersModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-3 sm:p-4" style="display: none;" @click.self="showUsersModal = false"
     @keydown.escape.window="if (editModal) { editModal = false } else if (showCreateModal) { showCreateModal = false } else { showUsersModal = false }">

    <div class="bg-[#1b313b] text-slate-100 rounded-2xl shadow-2xl max-w-4xl w-full p-4 sm:p-6 overflow-hidden border border-[#274452]">
        <div class="flex justify-between items-center mb-4 pb-3 border-b border-[#274452]">
            <div class="flex items-center gap-4">
                <h2 class="text-lg sm:text-xl font-bold text-white">Управління користувачами</h2>
                <button type="button" @click="showCreateModal = true" class="bg-cyan-600 hover:bg-cyan-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition shadow-sm">+ Додати користувача</button>
            </div>
            <button type="button" @click="showUsersModal = false" class="text-slate-400 hover:text-white text-2xl font-bold">×</button>
        </div>

        <div class="overflow-y-auto max-h-[70vh]">
            <table class="w-full text-left text-xs sm:text-sm border-collapse">
                <thead>
                <tr class="text-slate-400 uppercase text-[10px] sm:text-xs font-semibold tracking-wider border-b border-[#274452]">
                    <th class="py-3 px-4">ID</th>
                    <th class="py-3 px-4">Логін</th>
                    <th class="py-3 px-4">Роль</th>
                    <th class="py-3 px-4 text-right">Дії</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-[#274452]/50">
                {% for user in users %}
                <tr class="hover:bg-white/5 transition">
                    <td class="py-3 px-4 text-slate-400 font-mono">#{{ user.id }}</td>
                    <td class="py-3 px-4 font-bold text-white">{{ user.username }}</td>
                    <td class="py-3 px-4">
                        <span class="px-2.5 py-1 rounded-full text-xs font-bold {% if user.role == 'admin' %}bg-purple-950 text-purple-300 border border-purple-800{% else %}bg-blue-950 text-blue-300 border border-blue-800{% endif %}">
                            {{ user.role }}
                        </span>
                    </td>
                    <td class="py-3 px-4 text-right space-x-2">
                        <button type="button" data-user-id="{{ user.id }}" data-username="{{ user.username }}" data-role="{{ user.role }}"
                                @click="currentEdit = { id: $el.dataset.userId, username: $el.dataset.username, role: $el.dataset.role }; editModal = true"
                                class="text-cyan-300 hover:text-white font-bold text-xs px-3 py-1.5 bg-white/5 hover:bg-white/10 rounded-lg transition border border-[#274452]">Редагувати
                        </button>
                        <form action="/users/{{ user.id }}/delete" method="POST" class="inline" onsubmit="return confirm('Видалити цього користувача?');">
                            <button type="submit" class="text-red-300 hover:text-red-100 font-bold text-xs px-3 py-1.5 bg-red-950/40 hover:bg-red-900/60 rounded-lg transition border border-red-900/50">Видалити</button>
                        </form>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="4" class="p-6 text-center text-slate-400">Користувачів ще не створено</td>
                </tr>
                {% endfor %}
                </tbody>
            </table>
        </div>

        <div class="mt-6 flex justify-end">
            <button type="button" @click="showUsersModal = false" class="px-5 py-2 bg-[#274452] hover:bg-[#325364] text-white font-medium rounded-xl text-sm transition">Закрити</button>
        </div>
    </div>
</div>

<!-- 2. МОДАЛЬНЕ ВІКНО СТВОРЕННЯ КОРИСТУВАЧА -->
<div x-show="showCreateModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-3 sm:p-4" style="display: none;" @click.self="showCreateModal = false">
    <div class="bg-[#1b313b] text-slate-100 rounded-2xl shadow-2xl max-w-md w-full p-6 space-y-4 border border-[#274452]">
        <div class="flex justify-between items-center pb-3 border-b border-[#274452]">
            <h3 class="text-lg font-bold text-white">Додати нового користувача</h3>
            <button type="button" @click="showCreateModal = false" class="text-slate-400 hover:text-white text-2xl font-bold">×</button>
        </div>
        <form action="/users/create" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Логін</label>
                <input type="text" name="username" required class="w-full bg-[#11222b] border border-[#274452] rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-cyan-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Пароль</label>
                <input type="password" name="password" required class="w-full bg-[#11222b] border border-[#274452] rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-cyan-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Роль</label>
                <select name="role" class="w-full bg-[#11222b] border border-[#274452] rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-cyan-500">
                    <option value="kasa1">Касир1</option>
                    <option value="kasa2">Касир2</option>
                    <option value="admin">Адміністратор</option>
                </select>
            </div>
            <div class="flex justify-end space-x-3 pt-2">
                <button type="button" @click="showCreateModal = false" class="px-4 py-2 bg-[#274452] hover:bg-[#325364] text-slate-200 rounded-xl text-sm font-medium transition">Скасувати</button>
                <button type="submit" class="px-5 py-2 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded-xl text-sm shadow transition">Зберегти</button>
            </div>
        </form>
    </div>
</div>

<!-- 3. МОДАЛЬНЕ ВІКНО РЕДАГУВАННЯ КОРИСТУВАЧА -->
<div x-show="editModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-3 sm:p-4" style="display: none;" @click.self="editModal = false">
    <div class="bg-[#1b313b] text-slate-100 rounded-2xl shadow-2xl max-w-md w-full p-6 space-y-4 border border-[#274452]">
        <div class="flex justify-between items-center pb-3 border-b border-[#274452]">
            <h3 class="text-lg font-bold text-white">Редагувати користувача</h3>
            <button type="button" @click="editModal = false" class="text-slate-400 hover:text-white text-2xl font-bold">×</button>
        </div>
        <form :action="`/users/${currentEdit.id}/edit`" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Логін</label>
                <input type="text" name="username" x-model="currentEdit.username" required class="w-full bg-[#11222b] border border-[#274452] rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-cyan-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Новий пароль (залишіть порожнім)</label>
                <input type="password" name="password" placeholder="••••••••" class="w-full bg-[#11222b] border border-[#274452] rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-cyan-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Роль</label>
                <select name="role" x-model="currentEdit.role" class="w-full bg-[#11222b] border border-[#274452] rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-cyan-500">
                    <option value="kasa1">Касир1</option>
                    <option value="kasa2">Касир2</option>
                    <option value="admin">Адміністратор</option>
                </select>
            </div>
            <div class="flex justify-end space-x-3 pt-2">
                <button type="button" @click="editModal = false" class="px-4 py-2 bg-[#274452] hover:bg-[#325364] text-slate-200 rounded-xl text-sm font-medium transition">Скасувати</button>
                <button type="submit" class="px-5 py-2 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded-xl text-sm shadow transition">Оновити</button>
            </div>
        </form>
    </div>
</div>
