<!-- МОДАЛЬНЕ ВІКНО СКАСУВАННЯ З ОБОВ'ЯЗКОВИМ КОМЕНТАРЕМ -->
<div x-show="cancelModal.open" x-cloak class="fixed inset-0 bg-black/75 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl border-t-4 border-red-500" @click.away="cancelModal.open = false">
        <h3 class="text-xl font-bold text-red-600 mb-1">Скасування талону
            <span x-text="'#' + cancelModal.ticketNumber"></span></h3>
        <p class="text-xs text-gray-500 mb-4">Будь ласка, вкажіть причину скасування для подальшої статистики.</p>

        <!-- Швидкі теги причин -->
        <div class="flex flex-wrap gap-1.5 mb-3">
            <template x-for="preset in ['Не підійшов розмір', 'Відмова клієнта', 'Помилка касира', 'Клієнт не з’явився']">
                <button type="button" @click="cancelModal.reason = preset" class="text-xs px-2.5 py-1 rounded-lg border border-gray-300 hover:bg-gray-100 text-gray-700 transition" x-text="preset"></button>
            </template>
        </div>
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Причина скасування *</label>
            <textarea x-model.trim="cancelModal.reason" rows="3" placeholder="Опишіть причину детальніше..." class="w-full border border-gray-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-red-500 focus:outline-none"></textarea>
            <p x-show="cancelModal.error" x-text="cancelModal.error" class="text-red-500 text-xs mt-1 font-medium"></p>
        </div>
        <div class="flex justify-end gap-3">
            <button type="button" @click="cancelModal.open = false" class="bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded-xl text-sm font-medium text-gray-700">Назад</button>
            <button type="button" @click="submitCancel()" :disabled="!cancelModal.reason || cancelModal.reason.length < 3" class="bg-red-600 hover:bg-red-700 text-white px-5 py-2 rounded-xl text-sm font-bold disabled:opacity-40 disabled:cursor-not-allowed transition">Підтвердити скасування</button>
        </div>
    </div>
</div>
