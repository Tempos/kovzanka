<!-- МОДАЛЬНЕ ВІКНО РЕДАГУВАННЯ КВИТКА -->
<div x-show="editModal.open" x-cloak class="fixed inset-0 bg-black/75 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-2xl border border-slate-200 max-h-[90vh] overflow-y-auto" @click.away="editModal.open = false">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-xl font-bold text-slate-800">
                ✏️ Редагування талону <span class="text-blue-600" x-text="'#' + editModal.ticketNumber"></span>
            </h3>
            <button type="button" @click="editModal.open = false" class="text-slate-400 hover:text-slate-600 text-xl font-bold px-2">×</button>
        </div>

        <!-- БЛОК ПОЗНАЧЕННЯ ПРОБЛЕМИ -->
        <div class="mb-5 p-4 bg-slate-50 border border-slate-200 rounded-xl space-y-3">
            <div class="flex justify-between items-center">
                <label class="block text-sm font-bold text-slate-700">⚠️ Статус проблеми та зауваження</label>
                <button type="button" @click="editModal.issueStatus = null; editModal.issueNote = ''" x-show="editModal.issueStatus" class="text-xs text-rose-600 font-semibold hover:underline cursor-pointer">
                    ✕ Скинути статус
                </button>
            </div>
            <div class="flex gap-2">
                <button type="button" @click="editModal.issueStatus = 'warning'" class="flex-1 py-2 px-3 rounded-lg border text-xs transition"
                        :class="editModal.issueStatus === 'warning' ? 'bg-amber-500 text-white font-bold border-amber-600 ring-2 ring-amber-300 shadow' : 'bg-amber-50 text-amber-900 border-amber-200 hover:bg-amber-100'">
                    🟡 Увага (Бурштиновий)
                </button>
                <button type="button" @click="editModal.issueStatus = 'danger'" class="flex-1 py-2 px-3 rounded-lg border text-xs transition"
                        :class="editModal.issueStatus === 'danger' ? 'bg-red-600 text-white font-bold border-red-700 ring-2 ring-red-300 shadow' : 'bg-red-50 text-red-900 border-red-300 hover:bg-red-100'">
                    🔴 Проблема (Червоний)
                </button>
            </div>
            <div x-show="editModal.issueStatus" class="space-y-2 pt-1" x-cloak>
                <div class="flex flex-wrap gap-1.5">
                    <template x-for="preset in ['Не підійшов розмір', 'Заміна пари', 'Брак застібки', 'Чекає на лавці']">
                        <button type="button" @click="editModal.issueNote = preset" class="text-[11px] px-2 py-1 rounded-md border border-slate-300 bg-white hover:bg-slate-100 text-slate-700 transition shadow-xs" x-text="preset"></button>
                    </template>
                </div>
                <input type="text" x-model.trim="editModal.issueNote" placeholder="Що не так? (зникне після зняття позначки)" class="w-full px-3 py-2 border border-slate-300 bg-white rounded-lg text-xs text-slate-900 focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
        </div>

        <!-- Tabs Navigation -->
        <div class="flex bg-slate-100 p-1 rounded-xl mb-3 border border-slate-200">
            <button type="button" @click="editModal.activeTab = 'figure'"
                    :class="editModal.activeTab === 'figure' ? 'bg-white text-blue-600 font-bold shadow-sm' : 'text-slate-600 hover:text-slate-900'"
                    class="flex-1 py-2 text-center text-sm transition rounded-lg">
                ⛸️ Фігурні
            </button>
            <button type="button" @click="editModal.activeTab = 'hockey'"
                    :class="editModal.activeTab === 'hockey' ? 'bg-white text-blue-600 font-bold shadow-sm' : 'text-slate-600 hover:text-slate-900'"
                    class="flex-1 py-2 text-center text-sm transition rounded-lg">
                🏒 Хокейні
            </button>
        </div>

        <div class="flex justify-between items-center mb-2">
            <div class="text-[11px] text-slate-400 font-mono">💡 ЛКМ: додати пару • ПКМ: видалити пару</div>
            <button @click="clearEditSizes()" class="text-xs font-semibold text-red-600 bg-red-50 hover:bg-red-100 border border-red-200 px-2 py-0.5 rounded transition"
                    type="button" x-show="editModal.sizes.length > 0">
                ✕ Очистити вибір
            </button>
        </div>

        <!-- Сітка кнопок розмірів -->
        <div class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 gap-2 bg-slate-50 p-3 sm:p-4 rounded-xl border border-slate-200 mb-4">
            <template x-for="(data, size) in filteredEditInventory" :key="size">
                <button type="button" @click="addEditSize(size)" @contextmenu.prevent="removeEditSize(size)" :class="getEditSizeCount(size) > 0 ? 'size-btn-active'
                        : (getEffectiveAvailable(size) > 0 ? 'size-btn-idle' : 'bg-red-50 text-red-900 border-red-200/60 hover:bg-red-100/50')"
                        class="size-btn relative flex flex-col items-center justify-center rounded-xl border text-center transition select-none cursor-pointer min-w-0 py-2">

                    <!-- Номер розміру -->
                    <span class="text-base sm:text-lg font-black tracking-tight font-mono" x-text="parseSizeNum(size)"></span>

                    <!-- Категорія -->
                    <span class="text-[9px] sm:text-[10px] font-bold uppercase tracking-tighter"
                          :class="getEditSizeCount(size) > 0 ? 'text-blue-100' : 'text-slate-500'"
                          x-text="parseSizeCat(size)"></span>

                    <!-- Живий індикатор залишку -->
                    <span class="text-[9px] sm:text-[10px] font-bold mt-0.5 tracking-tighter whitespace-nowrap"
                          :class="getEditSizeCount(size) > 0 ? 'text-blue-100' : (getEffectiveAvailable(size) > 0 ? 'text-slate-400' : 'text-red-500 font-extrabold')"
                          x-text="Math.max(0, getEffectiveAvailable(size) - getEditSizeCount(size)) + '/' + data.total">
                    </span>
                    <span class="absolute -top-2 -right-2 bg-blue-600 text-white text-xs font-black w-5 h-5 rounded-full flex items-center justify-center border border-white shadow"
                          x-show="getEditSizeCount(size) > 0" x-text="getEditSizeCount(size)"></span>

                    <!-- Індикатор часу повернення -->
                    <template x-if="getEffectiveAvailable(size) === 0 && data.next_available_in_mins !== null">
                        <span class="absolute -bottom-1.5 bg-yellow-400 text-slate-950 font-mono text-[9px] font-black px-1 rounded shadow"
                              x-text="'~' + data.next_available_in_mins + 'хв'">
                        </span>
                    </template>
                </button>
            </template>
        </div>

        <!-- Тривалість сеансу -->
        <div class="mb-5">
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Тривалість сеансу (хв)</label>
            <div class="flex gap-2">
                <template x-for="d in editModal.availableDurations" :key="d">
                    <button type="button" @click="editModal.duration = d" class="flex-1 py-2 px-2 rounded-lg border text-sm transition text-center" x-text="d + ' хв'"
                            :class="editModal.duration === d ? 'bg-blue-600 text-white font-semibold shadow' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'">
                    </button>
                </template>
            </div>
        </div>

        <!-- Редагування коментаря -->
        <div class="mb-5">
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Коментар до замовлення</label>
            <input type="text" x-model.trim="editModal.comment" placeholder="Введіть нотатку або залиште порожнім..."
                   class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <!-- Кнопки збереження -->
        <div class="flex justify-end gap-3">
            <button type="button" @click="editModal.open = false" class="bg-gray-200 hover:bg-gray-300 px-4 py-2.5 rounded-xl text-sm font-semibold text-gray-700">
                Відміна
            </button>
            <button type="button" @click="submitEdit()" :disabled="editModal.sizes.length === 0" class="bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 px-5 py-2.5 rounded-xl text-sm font-bold text-white transition">
                Зберегти зміни
            </button>
        </div>
    </div>
</div>
