<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Льодова Кавзанка</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center py-3 px-4">
    <div class="max-w-md w-full space-y-2">
        <h1 class="text-lg sm:text-2xl font-black text-center text-blue-400">⛸️ Льодова Кавзанка</h1>

        <!-- Customer Links -->
        <a href="/status" class="block bg-blue-900/40 hover:bg-blue-900/60 border border-blue-500/40 py-2 px-4 rounded-xl text-center text-blue-300 transition text-sm sm:text-base font-bold">
            📱 Перевірити статус <span class="font-normal text-xs text-blue-200/70 ml-1">— Статус талона</span>
        </a>
        <a href="/display" class="block bg-slate-800 hover:bg-slate-700 py-2 px-4 rounded-xl border border-slate-700 text-center transition text-sm sm:text-base font-bold">
            📺 Табло черги <span class="font-normal text-xs text-slate-400 ml-1">— Display</span>
        </a>
        <a href="/inventory" class="block bg-slate-800 hover:bg-slate-700 py-2 px-4 rounded-xl border border-slate-700 text-center transition text-sm sm:text-base font-bold">
            📊 Залишки ковзанів <span class="font-normal text-xs text-slate-400 ml-1">— Inventory</span>
        </a>

        <!-- Divider -->
        <div class="border-t border-slate-800 my-2"></div>

        <!-- Staff Portal Link -->
        <a href="/staff" class="block bg-slate-800/50 hover:bg-slate-800 py-1.5 px-4 rounded-xl border border-slate-700/60 text-center text-slate-300 transition text-xs sm:text-sm font-semibold">
            🔐 Сторінка для персоналу
        </a>
    </div>
</body>
</html>
