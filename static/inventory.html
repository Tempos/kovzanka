<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Inventory — Ковзанка Staff</title>
    <script defer src="/static/js/alpine.js"></script>
    <script src="/static/js/tailwind.js"></script>
    <script src="/static/js/shared.js"></script>
    <script src="/static/js/inventory.js"></script>
</head>
<body class="bg-gray-100 p-6">
<div class="max-w-4xl mx-auto" x-data="inventory()" x-init="init()">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-gray-800">Inventory</h1>
        <div class="flex items-center space-x-4">
            <!-- WebSocket Status Badge -->
            <div class="flex items-center space-x-2 bg-gray-50 border border-gray-200 px-2.5 py-1 rounded-full">
                <span :class="wsStatus.class" class="w-2.5 h-2.5 rounded-full transition-colors inline-block"></span>
                <span class="text-xs font-mono text-gray-600 leading-none" x-text="wsStatus.text"></span>
            </div>
        </div>
    </div>

    <!-- Inventory Table Component -->
    <div class="bg-white shadow rounded-lg p-4 overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200 text-left text-sm">
            <thead>
            <tr class="bg-gray-50 text-gray-600 uppercase text-xs font-medium tracking-wider">
                <th class="py-3 px-4">Розмір</th>
                <th class="py-3 px-4 text-center">Всього</th>
                <th class="py-3 px-4 text-center">На руках</th>
                <th class="py-3 px-4 text-center">Вільні</th>
                <th class="py-3 px-4 text-center">У черзі</th>
                <th class="py-3 px-4 text-right">Орієнт. очікування</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-gray-200 bg-white">
            <template x-for="(data, size) in inventory" :key="size">
                <tr class="hover:bg-gray-50 transition">
                    <td class="py-3 px-4 font-bold text-gray-900" x-text="size"></td>
                    <td class="py-3 px-4 text-center text-gray-700" x-text="data.total"></td>
                    <td class="py-3 px-4 text-center text-blue-600 font-semibold" x-text="data.in_use"></td>
                    <td class="py-3 px-4 text-center">
                        <span :class="data.available > 0 ? 'text-green-600 font-bold' : 'text-red-500 font-bold'" x-text="data.available"></span>
                    </td>
                    <td class="py-3 px-4 text-center text-amber-600 font-semibold" x-text="data.in_queue || 0"></td>
                    <td class="py-3 px-4 text-right text-gray-500" x-text="data.next_available_in_mins ? data.next_available_in_mins + ' хв' : '—'"></td>
                </tr>
            </template>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
