<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Наявність ковзанів — Акула Мама</title>
    <script defer src="/static/js/alpine.js"></script>
    <script src="/static/js/tailwind.js"></script>
    <script src="/static/js/shared.js"></script>
    <script src="/static/js/inventory.js"></script>
    <link rel="stylesheet" href="/static/css/akulamama.css">
    <script defer src="/static/js/akulamama.js"></script>
</head>
<body class="ak-site ak-inventory bg-gray-100 p-6">
<header class="ak-header">
    <a href="/" class="ak-logo" aria-label="Акула Мама — головна"><img src="/static/brand/logo.png" alt="Акула Мама"><span>Ковзанка</span></a>
    <nav class="ak-nav" aria-label="Головна навігація"><a href="/">Головна</a><a href="/inventory">Залишки</a><a href="/display">Табло</a><a
            href="/status">Мій талон</a><a href="/staff">Для персоналу</a>
        <template x-if="isAdmin"><a href="/kasa2" class="text-pink-400 font-bold">⚙️ Каса 2 (Адмін)</a></template>
    </nav>
</header>
<main class="ak-page">
    <div class="max-w-4xl mx-auto" x-data="inventory({ isAdmin: {{ 'true' if is_admin else 'false' }} })" x-init="init()">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800" x-text="isAdmin ? 'Керування залишками ковзанів (Адмін)' : 'Наявність ковзанів'"></h1>
            <div class="flex items-center space-x-4">
                <div :title="wsStatus.title" class="inline-flex items-center justify-center py-1.5 cursor-help">
                    <span :class="wsStatus.class" class="w-3 h-3 rounded-full transition-colors inline-block"></span>
                    <span class="text-xs font-mono text-gray-400 leading-none" :class="wsStatus.text ? 'ml-2' : ''" x-text="wsStatus.text"></span>
                </div>
            </div>
        </div>

        <!-- Add New Size Form (Admin Only) -->
        <div x-show="isAdmin" class="bg-white shadow rounded-lg p-4 mb-6" style="display: none;">
            <h3 class="text-sm font-bold text-gray-800 mb-3 uppercase tracking-wider">➕ Додати новий розмір</h3>
            <div class="flex flex-col sm:flex-row gap-3">
                <input type="text" x-model="newSize" placeholder="Розмір (напр. 42)" class="px-3 py-2 border rounded text-sm flex-1">

                <!-- Category Selector Dropdown -->
                <select x-model="newCategory" class="px-3 py-2 border rounded text-sm bg-white text-gray-700">
                    <option value="figure">⛸️ Фігурні</option>
                    <option value="hockey">🏒 Хокейні</option>
                </select>

                <input type="number" x-model.number="newTotal" placeholder="Всього штук" min="1"
                       class="px-3 py-2 border rounded text-sm w-full sm:w-28">
                <button @click="addSize()" class="bg-green-600 hover:bg-green-700 text-white px-5 py-2 rounded text-sm font-bold transition">
                    Додати в базу
                </button>
            </div>
        </div>

        <!-- Inventory Table Component -->
        <div class="bg-white shadow rounded-lg p-2 sm:p-4 overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200 text-left text-xs sm:text-sm">
                <thead>
                <tr class="bg-gray-50 text-gray-600 uppercase text-[10px] sm:text-xs font-medium tracking-wider">
                    <th class="py-2 px-2 sm:py-3 sm:px-4">Розмір</th>
                    <th class="py-2 px-2 sm:py-3 sm:px-4 text-center">Всього</th>
                    <th class="py-2 px-2 sm:py-3 sm:px-4 text-center">На руках</th>
                    <th class="py-2 px-2 sm:py-3 sm:px-4 text-center">Вільні</th>
                    <th class="py-2 px-2 sm:py-3 sm:px-4 text-center">У черзі</th>
                    <th x-show="isAdmin" class="py-2 px-2 sm:py-3 sm:px-4 text-center" style="display: none;">На ремонті</th>
                    <th class="py-2 px-2 sm:py-3 sm:px-4" :class="isAdmin ? 'text-center' : 'text-right'">Орієнт. очікування</th>
                    <th x-show="isAdmin" class="py-2 px-2 sm:py-3 sm:px-4 text-right" style="display: none;">Дії</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-gray-200 bg-white">
                <template x-for="(data, size) in inventory" :key="size">
                    <tr class="hover:bg-gray-50 transition">
                        <td class="py-2 px-3 sm:py-3 sm:px-4 font-bold text-gray-900">
                            <span x-text="parseSizeNum(size)"></span>
                            <span class="text-xs text-gray-400 font-normal ml-1" x-text="parseSizeCat(size)"></span>
                        </td>

                        <!-- Total Stock (Read-only for public, +/- buttons for Admin) -->
                        <td class="py-2 px-2 sm:py-3 sm:px-4 text-center">
                            <span x-show="!isAdmin" class="text-gray-700" x-text="data.total"></span>
                            <div x-show="isAdmin" class="inline-flex items-center gap-1 justify-center" style="display: none;">
                                <button @click="updateStock(size, data.total - 1)"
                                        class="px-1.5 py-0.5 bg-gray-200 hover:bg-gray-300 rounded text-xs font-bold">-
                                </button>
                                <span class="font-bold text-gray-800 w-6 text-center" x-text="data.total"></span>
                                <button @click="updateStock(size, data.total + 1)"
                                        class="px-1.5 py-0.5 bg-gray-200 hover:bg-gray-300 rounded text-xs font-bold">+
                                </button>
                            </div>
                        </td>

                        <td class="py-2 px-2 sm:py-3 sm:px-4 text-center text-blue-600 font-semibold" x-text="data.in_use"></td>
                        <td class="py-2 px-2 sm:py-3 sm:px-4 text-center">
                            <span :class="data.available > 0 ? 'text-green-600 font-bold' : 'text-red-500 font-bold'" x-text="data.available"></span>
                        </td>
                        <td class="py-2 px-2 sm:py-3 sm:px-4 text-center text-amber-600 font-semibold" x-text="data.in_queue || 0"></td>

                        <!-- Maintenance Column (Admin only) -->
                        <td x-show="isAdmin" class="py-2 px-2 sm:py-3 sm:px-4 text-center" style="display: none;">
                            <div class="inline-flex items-center gap-1 justify-center">
                                <button @click="updateStock(size, data.total, (data.maintenance_count || 0) - 1)"
                                        class="px-1.5 py-0.5 bg-amber-100 hover:bg-amber-200 text-amber-800 rounded text-xs font-bold">-
                                </button>
                                <span class="font-bold text-amber-900 w-6 text-center" x-text="data.maintenance_count || 0"></span>
                                <button @click="updateStock(size, data.total, (data.maintenance_count || 0) + 1)"
                                        class="px-1.5 py-0.5 bg-amber-100 hover:bg-amber-200 text-amber-800 rounded text-xs font-bold">+
                                </button>
                            </div>
                        </td>

                        <td class="py-2 px-2 sm:py-3 sm:px-4 text-gray-500 font-mono text-xs" :class="isAdmin ? 'text-center' : 'text-right'"
                            x-text="formatCountdown(data.target_timestamp, now)"></td>

                        <!-- Delete Button (Admin only) -->
                        <td x-show="isAdmin" class="py-2 px-2 sm:py-3 sm:px-4 text-right" style="display: none;">
                            <button @click="deleteSize(size)" class="text-red-500 hover:text-red-700 font-bold px-2 py-1 rounded text-xs"
                                    title="Видалити розмір">
                                🗑️
                            </button>
                        </td>
                    </tr>
                </template>
                </tbody>
            </table>
        </div>
    </div>
</main>
<footer class="ak-footer"><span>© Акула Мама · Ковзанка</span><span>Час для руху. Місце для вражень.</span><a href="/staff">Вхід для працівників ↗</a>
</footer>
</body>
</html>
