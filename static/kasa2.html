<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Каса 2 - Видача ковзанів</title>
    <script defer src="/static/js/alpine.js"></script>
    <script src="/static/js/tailwind.js"></script>
    <script src="/static/js/shared.js"></script>
    <script src="/static/js/kasa2.js"></script>
<link rel="stylesheet" href="/static/css/akulamama.css">
<script defer src="/static/js/akulamama.js"></script>
</head>
<body class="ak-site ak-kasa2 bg-gray-100 min-h-screen p-8" x-data="kasa2App()">
<header class="ak-header">
    <a href="/" class="ak-logo" aria-label="Акула Мама — головна"><img src="/static/brand/logo.png" alt="Акула Мама"><span>Ковзанка</span></a>
    <nav class="ak-nav" aria-label="Головна навігація"><a href="/">Для гостей</a><a href="/staff">Персонал</a><a href="/kasa1">Реєстрація</a><a href="/kasa2">Видача</a><a href="/inventory">Залишки</a><a href="/docs">API</a></nav>
</header>
<main class="ak-page">
<div class="max-w-6xl mx-auto">
    <!-- Шапка -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
        <h1 class="text-2xl sm:text-3xl font-bold text-gray-800 text-center sm:text-left w-full sm:w-auto">Каса №2: Видача ковзанів</h1>

        <div class="flex items-center space-x-4 w-full sm:w-auto justify-between sm:justify-end">
            <button class="inline-flex items-center px-3 py-1.5 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 shadow-sm transition"
                    @click="showInventoryModal = true; fetchInventory()"> Наявність ковзанів
            </button>

            <!-- WebSocket Status Badge with Mouseover Tooltip -->
            <div :title="wsStatus.title" class="inline-flex items-center justify-center py-1.5 cursor-help">
                <span :class="wsStatus.class" class="w-3 h-3 rounded-full transition-colors inline-block"></span>
                <span class="text-xs font-mono text-gray-400 leading-none" :class="wsStatus.text ? 'ml-2' : ''" x-text="wsStatus.text"></span>
            </div>
        </div>
    </div>

    <!-- Таблиця черги -->
    <div class="bg-white rounded-lg shadow overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200 border-collapse">
            <thead class="bg-gray-50">
            <tr>
                <th class="px-3 sm:px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">№</th>
                <th class="px-3 sm:px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Телефон</th>
                <th class="px-2 sm:px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Розміри</th>
                <th class="px-3 sm:px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Час / Сеанс</th>
                <th class="px-3 sm:px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Статус</th>
                <th class="px-3 sm:px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Дії</th>
            </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
            <template :key="item.id" x-for="item in queue">
                <tr class="hover:bg-gray-50 transition-colors">
                    <!--TICKET-->
                    <td class="px-3 sm:px-6 py-4 whitespace-nowrap text-base sm:text-lg font-bold text-gray-900" x-text="'#' + item.ticket_number"></td>

                    <!--PHONE / COMMENT-->
                    <td class="px-3 sm:px-4 py-3 align-middle">
                        <div class="font-mono font-bold text-slate-900 leading-tight whitespace-nowrap text-xs sm:text-sm" x-text="formatPhone(item.phone)"></div>
                        <template x-if="item.comment">
                            <div :title="item.comment" class="mt-1 text-xs text-amber-800 bg-amber-50 px-1.5 py-0.5
                            rounded border border-amber-200/60 max-w-[160px] truncate cursor-help leading-tight">
                                💬 <span x-text="item.comment"></span>
                            </div>
                        </template>
                    </td>

                    <!--SIZES-->
                    <td class="px-2 py-3 min-w-[130px] sm:min-w-[160px]">
                        <div class="flex flex-wrap gap-1">
                            <template x-for="(size, idx) in item.shoe_sizes" :key="idx">
                                <span class="w-7 h-7 flex items-center justify-center bg-slate-100 text-slate-800 text-xs font-bold rounded border border-slate-200 shrink-0">
                                    <span x-text="size"></span>
                                </span>
                            </template>
                        </div>
                    </td>

                    <!--TIME-->
                    <td class="px-3 sm:px-6 py-4 whitespace-nowrap text-xs sm:text-sm font-mono font-bold">
                        <div class="flex flex-col">
                            <!-- Live: counts down while serving, otherwise shows ordered duration -->
                            <span :class="(item.status === 'ОБСЛУГОВУЄТЬСЯ' || item.status === 'SERVED') && item.session_end ? 'text-blue-700' : 'text-gray-600'"
                                  x-text="getTimeDisplay(item)"></span>

                            <!-- Target End Time -->
                            <template x-if="item.session_end">
                                <span class="text-xs text-blue-600" x-text="'до ' + formatTime(item.session_end)"></span>
                            </template>

                            <!-- Overtime Badge: ticks up live once session_end has passed -->
                            <template x-if="(item.status === 'ОБСЛУГОВУЄТЬСЯ' || item.status === 'SERVED') && getOverdueTime(item.session_end)">
                                <span :title="'Протерміновано на ' + getOverdueTime(item.session_end)"
                                      class="mt-1 inline-flex items-center w-max px-2 py-0.5 rounded-full text-xs font-bold bg-red-100 text-red-800 border border-red-200 animate-pulse cursor-help">
                                    ⏱️ +<span x-text="getOverdueTime(item.session_end)"></span>
                                </span>
                            </template>
                        </div>
                    </td>

                    <!--STATUS-->
                    <td class="px-3 sm:px-6 py-4 whitespace-nowrap">
                        <span :class="{
                                  'bg-yellow-100 text-yellow-800': item.status === 'ЧЕКАЄ',
                                  'bg-green-100 text-green-800': item.status === 'ВИКЛИКАЄТЬСЯ',
                                  'bg-blue-100 text-blue-800': item.status === 'ОБСЛУГОВУЄТЬСЯ',
                                  'bg-purple-100 text-purple-800': item.status === 'ПОВЕРНЕНО',
                                  'bg-red-100 text-red-800': item.status === 'СКАСОВАНО'
                              }"
                              class="px-2.5 py-1 inline-flex text-xs leading-5 font-semibold rounded-full"
                              x-text="item.status">
                        </span>
                    </td>

                    <!-- BUTTONS -->
                    <td class="px-3 sm:px-4 py-4 whitespace-nowrap text-right text-sm font-medium">
                        <div class="inline-flex items-center justify-end gap-1.5 flex-wrap">

                            <!-- Якщо чекає -->
                            <template x-if="item.status === 'ЧЕКАЄ'">
                                <button @click="changeStatus(item.id, 'ВИКЛИКАЄТЬСЯ')"
                                        class="bg-green-600 hover:bg-green-700 text-white px-2.5 sm:px-3 py-1 rounded text-xs font-bold transition">
                                    Викликати
                                </button>
                            </template>

                            <!-- Якщо викликаний -->
                            <template x-if="item.status === 'ВИКЛИКАЄТЬСЯ'">
                                <button @click="changeStatus(item.id, 'ОБСЛУГОВУЄТЬСЯ')"
                                        class="bg-blue-600 hover:bg-blue-700 text-white px-2.5 sm:px-3 py-1 rounded text-xs font-bold transition">
                                    Видати ковзани
                                </button>
                            </template>

                            <!-- Якщо катається -->
                            <template x-if="item.status === 'ОБСЛУГОВУЄТЬСЯ'">
                                <div class="inline-flex gap-1">
                                    <button @click="extendSession(item.id, 15)"
                                            class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-2 py-1 rounded text-xs transition">
                                        +15 хв
                                    </button>
                                    <button @click="changeStatus(item.id, 'ПОВЕРНЕНО')"
                                            class="bg-purple-600 hover:bg-purple-700 text-white px-2.5 sm:px-3 py-1 rounded text-xs font-bold transition">
                                        Прийняти
                                    </button>
                                </div>
                            </template>

                            <!-- Завжди доступне скасування для активних -->
                            <template x-if="item.status !== 'ПОВЕРНЕНО' && item.status !== 'СКАСОВАНО'">
                                <button @click="changeStatus(item.id, 'СКАСОВАНО')"
                                        class="bg-gray-200 hover:bg-red-600 hover:text-white text-gray-700 px-2 py-1 rounded text-xs transition"
                                        title="Скасувати">
                                    ✕
                                </button>
                            </template>

                        </div>
                    </td>
                </tr>
            </template>
            </tbody>
        </table>
        <template x-if="queue.length === 0">
            <div class="text-center py-8 text-gray-500">Активних квитків у черзі немає</div>
        </template>
    </div>
</div>

<!-- Inventory Modal Popup -->
{% include "inventory_modal.html" %}
</main>
<footer class="ak-footer"><span>© Акула Мама · Ковзанка</span><span>Час для руху. Місце для вражень.</span><a href="/staff">Вхід для працівників ↗</a></footer>
</body>
</html>
